name: 🐛 Bug report
description: Report a bug or unexpected behavior in Ruvy-Runner
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.
        For **security vulnerabilities**, do NOT open an issue — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the bug?
      placeholder: |
        1. Go to '...'
        2. Press '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      description: Which mode were you playing?
      options:
        - Solo
        - Local duo
        - Online duo (Host)
        - Online duo (Join)
        - Autopilot (Alt+T)
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and device.
      placeholder: e.g. Chrome 127 on Windows 11 (desktop)
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Paste any browser console errors (especially for WebRTC / signaling issues).
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / recordings
      description: If applicable, add screenshots or a screen recording.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
        - label: I am on the latest version of the project
    validations:
      required: true
